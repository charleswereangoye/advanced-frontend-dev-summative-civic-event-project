<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CivicEvents+</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex flex-col justify-between">

  <!-- Toast notification container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

  <!-- Header with Figma logo -->
  <header class="py-6 px-8 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <img src="assets/logo.svg" alt="CivicEvents+ Logo" class="w-6 h-6">
      <span class="text-xl font-bold tracking-tight text-slate-900">CivicEvents+</span>
    </a>
    <a href="signup.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">
      Don't have an account? <span class="text-blue-600 font-semibold underline ml-1">Sign Up</span>
    </a>
  </header>

  <!-- Login Form Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
        <p class="text-sm text-slate-600 mt-1">Sign in to your account to view and manage events</p>
      </div>

      <!-- Alert message container -->
      <div id="form-alert" class="hidden mb-5 p-3 rounded-xl text-sm font-medium"></div>

      <form id="login-form" novalidate class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="e.g. alice@gmail.com"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
          >
          <p id="email-error" class="text-xs text-red-600 mt-1 hidden">Please enter a valid email address.</p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
            <button type="button" id="toggle-password" class="text-xs text-slate-500 hover:text-slate-800">Show</button>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
          >
          <p id="password-error" class="text-xs text-red-600 mt-1 hidden">Password is required.</p>
        </div>

        <!-- Storage options: Remember Me toggle -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input 
              type="checkbox" 
              id="remember_me" 
              class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"
            >
            <span class="text-xs text-slate-600">Remember me on this device</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submit-btn"
          class="w-full mt-2 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
        </button>
      </form>

      <!-- Bottom link -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Need assistance? Contact <a href="mailto:support@civicevents.gov" class="underline hover:text-slate-800">Municipal Helpdesk</a>.
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200">
    <p>&copy; 2026 CivicEvents+. Accessible City Events &amp; Services Portal.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    $(document).ready(function () {
      // Redirect if user is already logged in
      if (Auth.isAuthenticated()) {
        const user = Auth.getUser();
        // RBAC redirect: admins go to dashboard, regular users to events homepage
        if (user && user.role === 'admin') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
        return;
      }

      // Toggle password visibility
      $('#toggle-password').on('click', function () {
        const passwordInput = $('#password');
        const isPassword = passwordInput.attr('type') === 'password';
        passwordInput.attr('type', isPassword ? 'text' : 'password');
        $(this).text(isPassword ? 'Hide' : 'Show');
      });

      // Toast notification helper
      function showToast(message, type = 'success') {
        const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
        const toast = $(`
          <div class="${bgColor} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transition transform duration-300">
            <span>${message}</span>
          </div>
        `);
        $('#toast-container').append(toast);
        setTimeout(() => {
          toast.fadeOut(400, () => toast.remove());
        }, 3500);
      }

      // Form submission
      $('#login-form').on('submit', function (e) {
        e.preventDefault();

        const email = $('#email').val().trim();
        const password = $('#password').val();
        const rememberMe = $('#remember_me').is(':checked');

        // Reset error states
        $('#email-error, #password-error').addClass('hidden');
        $('#form-alert').addClass('hidden').empty();

        let hasError = false;

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          $('#email-error').removeClass('hidden');
          hasError = true;
        }

        if (!password) {
          $('#password-error').removeClass('hidden');
          hasError = true;
        }

        if (hasError) return;

        // Button loading state
        const submitBtn = $('#submit-btn');
        submitBtn.prop('disabled', true);
        $('#btn-text').text('Signing in...');
        $('#btn-spinner').removeClass('hidden');

        // Send login request to backend
        $.ajax({
          url: `${API_BASE_URL}/auth/login`,
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ email: email, password: password }),
          success: function (res) {
            // Save token and user info using client storage rule (localStorage if persistent, sessionStorage if session-only)
            const token = res.data.token;
            const user = res.data.user;
            Auth.setAuth(token, user, rememberMe);

            showToast('Login successful! Redirecting...', 'success');

            setTimeout(function () {
              // RBAC routing: admins go to dashboard, normal users go to events list
              if (user.role === 'admin') {
                window.location.href = 'dashboard.html';
              } else {
                window.location.href = 'index.html';
              }
            }, 1200);
          },
          error: function (xhr) {
            submitBtn.prop('disabled', false);
            $('#btn-text').text('Sign In');
            $('#btn-spinner').addClass('hidden');

            let errorMsg = 'Invalid email or password.';
            if (xhr.responseJSON && xhr.responseJSON.message) {
              errorMsg = xhr.responseJSON.message;
            }

            $('#form-alert')
              .removeClass('hidden')
              .addClass('bg-red-50 text-red-700 border border-red-200')
              .text(errorMsg);

            showToast(errorMsg, 'error');
          }
        });
      });
    });
  </script>
</body>
</html>
